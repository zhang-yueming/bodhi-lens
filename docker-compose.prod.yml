services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bodhi_lens
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: ${ECR_REGISTRY}/bodhi-lens-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    depends_on:
      - postgres
    restart: unless-stopped

  nginx:
    image: ${ECR_REGISTRY}/bodhi-lens-nginx:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
