spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bodhi_lens
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

app:
  s3:
    bucket: bodhi-lens
    region: us-east-1
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    public-url: http://localhost:9000/bodhi-lens

server:
  port: 8080